<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電量與充電提示學習樂園</title>
    <!-- Tailwind CSS for responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap');

        body {
            font-family: 'Zen Maru Gothic', 'Microsoft JhengHei', sans-serif;
            background-color: #FAF8F5; /* 護眼淡米色背景 */
            color: #1E293B;
        }

        /* 超大字體樣式 (特教友善 60px) */
        .text-sen-giant {
            font-size: clamp(32px, 5vw, 60px);
            line-height: 1.25;
        }

        .text-sen-large {
            font-size: clamp(24px, 3.5vw, 40px);
            line-height: 1.3;
        }

        /* 防誤觸超大按鈕，加大間距與陰影 */
        .sen-btn {
            min-height: 100px;
            padding: 1.5rem 2rem;
            border-radius: 2rem;
            border-width: 6px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            touch-action: manipulation;
        }

        .sen-btn:active {
            transform: scale(0.96);
        }

        /* 開關控與鍵盤聚焦提示加強 */
        *:focus {
            outline: 8px solid #0EA5E9 !important;
            outline-offset: 6px;
        }

        /* 呼吸警示動畫 */
        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .pulse-warning {
            animation: gentle-pulse 1.8s infinite ease-in-out;
        }

        /* 煙火 Canvas 置頂層 */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8 select-none">

    <!-- 煙火動畫畫布 -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- 頂部控制與標題區 -->
    <header class="w-full max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4 bg-white/80 p-6 rounded-3xl shadow-sm border-4 border-amber-200">
        <div class="flex items-center space-x-4">
            <span class="text-5xl" role="img" aria-label="閃電">⚡</span>
            <h1 class="text-3xl md:text-4xl font-black text-amber-900 tracking-wide">
                解讀電量與充電提示
            </h1>
        </div>

        <div class="flex items-center gap-4">
            <button id="voiceToggleBtn" onclick="toggleVoice()" class="bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 px-6 rounded-2xl text-xl flex items-center gap-2 border-4 border-teal-300">
                <span id="voiceIcon" class="text-2xl">🔊</span>
                <span id="voiceText">語音說明：開啟</span>
            </button>
            <button onclick="repeatInstruction()" class="bg-amber-500 hover:bg-amber-400 text-white font-bold py-3 px-6 rounded-2xl text-xl flex items-center gap-2 border-4 border-amber-200">
                <span class="text-2xl">💬</span>
                <span>重讀題目</span>
            </button>
        </div>
    </header>

    <!-- 中央核心導引與題目展示區 -->
    <main class="flex-1 max-w-6xl w-full mx-auto my-6 flex flex-col items-center justify-center space-y-8">
        
        <!-- 60px 超大題目與引導文字卡片 -->
        <div class="w-full bg-white border-8 border-amber-300 rounded-3xl p-8 md:p-10 text-center shadow-md">
            <p id="questionPrompt" class="text-sen-giant font-black text-slate-800 leading-tight">
                載入中...
            </p>
        </div>

        <!-- 擬人化設備與電量視覺圖片 display 區 (SVG 精密繪圖) -->
        <div id="deviceVisualCard" class="w-full max-w-2xl bg-sky-50/80 border-8 border-sky-200 rounded-3xl p-8 flex flex-col items-center justify-center relative shadow-inner min-h-[320px]">
            
            <!-- 表情與符號 -->
            <div id="avatarFace" class="text-6xl md:text-7xl mb-4">😊</div>

            <!-- 自訂大圖片畫布 (電池與設備畫面) -->
            <div id="visualGraphicContainer" class="w-full flex justify-center items-center">
                <!-- 動態注入 SVG 繪圖 -->
            </div>

            <!-- 反饋提示對話框 (彈出溫柔提示或讚美) -->
            <div id="feedbackBanner" class="hidden absolute inset-x-6 top-1/2 -translate-y-1/2 rounded-3xl p-6 text-center shadow-2xl border-8 transition-all">
                <p id="feedbackTitle" class="text-4xl font-black mb-2"></p>
                <p id="feedbackDetail" class="text-sen-large font-bold"></p>
            </div>
        </div>

        <!-- 操作/選項按鈕區 (極寬間距、防誤觸設計) -->
        <div id="answerOptionsArea" class="w-full grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10 pt-4">
            <!-- 動態生成特大選項按鈕 -->
        </div>

    </main>

    <!-- 底部關卡切換導覽 -->
    <footer class="w-full max-w-6xl mx-auto bg-white/80 p-4 rounded-3xl border-4 border-slate-200 shadow-sm">
        <div class="flex flex-wrap justify-center gap-6">
            <button onclick="loadLevel(1)" id="lvlBtn1" class="flex-1 min-w-[200px] bg-slate-100 hover:bg-slate-200 text-slate-800 font-black py-4 px-6 rounded-2xl text-2xl border-4 border-slate-300">
                1️⃣ 認識低電量訊號
            </button>
            <button onclick="loadLevel(2)" id="lvlBtn2" class="flex-1 min-w-[200px] bg-slate-100 hover:bg-slate-200 text-slate-800 font-black py-4 px-6 rounded-2xl text-2xl border-4 border-slate-300">
                2️⃣ 解讀充電提示
            </button>
            <button onclick="loadLevel(3)" id="lvlBtn3" class="flex-1 min-w-[200px] bg-slate-100 hover:bg-slate-200 text-slate-800 font-black py-4 px-6 rounded-2xl text-2xl border-4 border-slate-300">
                3️⃣ 電量小達人小測驗
            </button>
        </div>
    </footer>

    <script>
        // 狀態管理
        let voiceEnabled = true;
        let currentLevel = 1;
        let currentSubQuestion = 0;
        let audioCtx = null;
        let currentSpeechText = '';
        let isAnswerLocked = false;

        // 音效發聲器 (Web Audio API - 免外部檔案，極速且穩定)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 叮咚聲（答對回饋）
        function playDingDongSound() {
            initAudio();
            try {
                const now = audioCtx.currentTime;
                
                // 第一聲 "叮" (High E5)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                gain1.gain.setValueAtTime(0.4, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.6);

                // 第二聲 "咚" (Lower B5/G5 harmonic)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, now + 0.25); // C5
                gain2.gain.setValueAtTime(0.5, now + 0.25);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.25);
                osc2.stop(now + 1.2);
            } catch (e) {
                console.log("Audio play error", e);
            }
        }

        // 溫柔提示音（答錯回饋）
        function playGentleHintSound() {
            initAudio();
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle'; // 軟和三角波
                osc.frequency.setValueAtTime(329.63, now); // E4
                osc.frequency.exponentialRampToValueAtTime(261.63, now + 0.4); // C4
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            } catch(e) {}
        }

        // 語音朗讀 (TTS)
        function speak(text) {
            currentSpeechText = text;
            if (!voiceEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 清除排隊
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-HK'; // 設為粵語/廣東話或中文
                utter.rate = 0.85;   // 放慢語速利於聽辨
                utter.pitch = 1.1;   // 親切高音調
                window.speechSynthesis.speak(utter);
            }
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            document.getElementById('voiceText').innerText = voiceEnabled ? '語音說明：開啟' : '語音說明：關閉';
            document.getElementById('voiceIcon').innerText = voiceEnabled ? '🔊' : '🔇';
            if (voiceEnabled) speak("語音說明已開啟");
        }

        function repeatInstruction() {
            if (currentSpeechText) speak(currentSpeechText);
        }

        // 電池與設備 SVG 圖像動態生成器
        function generateBatterySVG(percent, isCharging = false, showRedWarning = false) {
            let fillColor = '#10B981'; // 綠色
            if (percent <= 20) fillColor = '#EF4444'; // 紅色
            else if (percent <= 50) fillColor = '#F59E0B'; // 黃色

            return `
                <div class="relative flex flex-col items-center">
                    <svg width="280" height="150" viewBox="0 0 280 150" class="drop-shadow-md">
                        <!-- 電池外框 -->
                        <rect x="10" y="10" width="220" height="130" rx="20" ry="20" fill="#FFFFFF" stroke="#334155" stroke-width="8"/>
                        <!-- 電池正極頭 -->
                        <path d="M230 45 Q245 45 245 60 L245 90 Q245 105 230 105 Z" fill="#334155"/>
                        
                        <!-- 容量充滿條 -->
                        <rect x="22" y="22" width="${(percent / 100) * 196}" height="106" rx="12" ry="12" fill="${fillColor}" class="transition-all duration-700"/>
                        
                        <!-- 閃電充電符號 (若充電中) -->
                        ${isCharging ? `
                            <polygon points="120,20 85,80 120,80 100,130 145,65 110,65" fill="#FACC15" stroke="#78350F" stroke-width="3" class="animate-bounce"/>
                        ` : ''}

                        <!-- 百分比數字 -->
                        <text x="120" y="90" text-anchor="middle" fill="${percent <= 20 && !isCharging ? '#FFFFFF' : '#0F172A'}" font-size="38" font-weight="900">${percent}%</text>
                    </svg>

                    <!-- 系統紅色低電量警告視窗彈出 (擬真情境) -->
                    ${showRedWarning ? `
                        <div class="mt-4 bg-red-100 border-4 border-red-500 rounded-2xl p-4 text-center pulse-warning shadow-lg max-w-sm">
                            <span class="text-3xl">⚠️</span>
                            <span class="text-2xl font-black text-red-700 ml-2">電量不足 (15%)</span>
                            <p class="text-xl font-bold text-red-600 mt-1">請盡快接上電源供應器！</p>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 關卡資料與邏輯
        const levelsData = {
            1: {
                prompt: "當平板出現紅色 15% 和警告視窗時，這是代表什麼呢？",
                face: "😰",
                percent: 15,
                isCharging: false,
                showWarning: true,
                options: [
                    { text: "🪫 電量不夠，需要充電了！", correct: true },
                    { text: "🔋 電量滿滿，可以繼續玩很久", correct: false }
                ],
                correctDetail: "太棒了！答對了！紅色數字和警示框代表電量不足，要趕緊充電喔！",
                wrongDetail: "我們再看一次喔！電池變成紅色而且只有 15%，代表電量快用完了喔！"
            },
            2: {
                prompt: "當我們接上充電線，看到黃色閃電符號 ⚡ 時，代表什麼？",
                face: "⚡😊",
                percent: 45,
                isCharging: true,
                showWarning: false,
                options: [
                    { text: "⚡ 正在正常充電中", correct: true },
                    { text: "❌ 設備壞掉了，不能用", correct: false }
                ],
                correctDetail: "叮咚！Bingo！看到黃色閃電符號，就代表電能正在源源不絕注入喔！",
                wrongDetail: "沒關係，我們仔細看看！螢幕上有一個黃色閃電 ⚡ 符號，這代表正在充電中喔！"
            },
            3: [
                {
                    prompt: "測驗題 1：看到哪個顏色代表電量『非常充足』，可以安心使用？",
                    face: "😃",
                    percent: 95,
                    isCharging: false,
                    showWarning: false,
                    options: [
                        { text: "🟢 綠色 100% 電量", correct: true },
                        { text: "🔴 紅色 10% 電量", correct: false }
                    ],
                    correctDetail: "答對了！綠色代表電量滿滿很健康！",
                    wrongDetail: "我們再試試看！綠色就像綠燈一樣，代表電量充足安全喔！"
                },
                {
                    prompt: "測驗題 2：跳出『電量不足警告』警示聲時，第一步該怎麼做？",
                    face: "🔌",
                    percent: 10,
                    isCharging: false,
                    showWarning: true,
                    options: [
                        { text: "🔌 報告老師或家長，幫忙接上充電器", correct: true },
                        { text: "🙈 不管它，繼續用力按螢幕", correct: false }
                    ],
                    correctDetail: "太聰明了！記得找大人幫忙安全接上充電線喔！",
                    wrongDetail: "沒關係，電量快用完時要記得找大人協助接上充電器喔！"
                }
            ]
        };

        // 載入關卡
        function loadLevel(lvlIndex) {
            currentLevel = lvlIndex;
            currentSubQuestion = 0;
            isAnswerLocked = false;
            updateFooterNav();
            renderCurrentQuestion();
        }

        function updateFooterNav() {
            [1, 2, 3].forEach(i => {
                const btn = document.getElementById(`lvlBtn${i}`);
                if (i === currentLevel) {
                    btn.className = "flex-1 min-w-[200px] bg-amber-500 text-white font-black py-4 px-6 rounded-2xl text-2xl border-4 border-amber-300 shadow-md";
                } else {
                    btn.className = "flex-1 min-w-[200px] bg-white hover:bg-slate-100 text-slate-800 font-black py-4 px-6 rounded-2xl text-2xl border-4 border-slate-300";
                }
            });
        }

        function renderCurrentQuestion() {
            hideFeedback();
            isAnswerLocked = false;
            
            let data;
            if (currentLevel === 3) {
                data = levelsData[3][currentSubQuestion];
            } else {
                data = levelsData[currentLevel];
            }

            // 更新題目 60px 字體
            const promptEl = document.getElementById('questionPrompt');
            promptEl.innerText = data.prompt;
            speak(data.prompt);

            // 更新擬人表情與圖像
            document.getElementById('avatarFace').innerText = data.face;
            document.getElementById('visualGraphicContainer').innerHTML = generateBatterySVG(data.percent, data.isCharging, data.showWarning);

            // 動態產生超大防誤觸選項按鈕 (間距加大、顏色明確)
            const optionsArea = document.getElementById('answerOptionsArea');
            optionsArea.innerHTML = '';

            const btnColors = [
                "bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-300",
                "bg-sky-600 hover:bg-sky-500 text-white border-sky-300"
            ];

            data.options.forEach((opt, idx) => {
                const button = document.createElement('button');
                button.className = `sen-btn ${btnColors[idx % 2]} text-sen-large font-black w-full flex items-center justify-center text-center shadow-xl`;
                button.innerText = opt.text;
                button.onclick = () => handleAnswer(opt.correct, data);
                optionsArea.appendChild(button);
            });
        }

        function handleAnswer(isCorrect, data) {
            if (isAnswerLocked) return;
            isAnswerLocked = true;

            const feedbackBanner = document.getElementById('feedbackBanner');
            const feedbackTitle = document.getElementById('feedbackTitle');
            const feedbackDetail = document.getElementById('feedbackDetail');

            feedbackBanner.classList.remove('hidden');

            if (isCorrect) {
                // 答對：叮咚聲 + 煙火爆發 + 溫暖鼓勵語
                playDingDongSound();
                triggerFireworks();
                
                feedbackBanner.className = "absolute inset-x-6 top-1/2 -translate-y-1/2 bg-emerald-50 border-8 border-emerald-400 rounded-3xl p-8 text-center shadow-2xl animate-bounce";
                feedbackTitle.className = "text-5xl font-black text-emerald-800 mb-2";
                feedbackTitle.innerText = "🎉 答對了！太厲害了！";
                feedbackDetail.className = "text-sen-large font-bold text-emerald-700";
                feedbackDetail.innerText = data.correctDetail;
                speak("答對了！" + data.correctDetail);

                // 2.5 秒後進入下一步驟
                setTimeout(() => {
                    if (currentLevel === 3 && currentSubQuestion < levelsData[3].length - 1) {
                        currentSubQuestion++;
                        renderCurrentQuestion();
                    } else if (currentLevel < 3) {
                        loadLevel(currentLevel + 1);
                    } else {
                        // 通關完全部測驗
                        showCompletionScreen();
                    }
                }, 3500);

            } else {
                // 答錯：溫柔提示音 + 親切語音引導（無打擊感）
                playGentleHintSound();
                
                feedbackBanner.className = "absolute inset-x-6 top-1/2 -translate-y-1/2 bg-amber-50 border-8 border-amber-400 rounded-3xl p-8 text-center shadow-2xl";
                feedbackTitle.className = "text-4xl font-black text-amber-800 mb-2";
                feedbackTitle.innerText = "💡 沒關係，我們再看一次喔！";
                feedbackDetail.className = "text-sen-large font-bold text-amber-700";
                feedbackDetail.innerText = data.wrongDetail;
                speak(data.wrongDetail);

                // 3 秒後自動解鎖讓學童重新選擇
                setTimeout(() => {
                    feedbackBanner.classList.add('hidden');
                    isAnswerLocked = false;
                }, 3500);
            }
        }

        function hideFeedback() {
            document.getElementById('feedbackBanner').classList.add('hidden');
        }

        function showCompletionScreen() {
            document.getElementById('questionPrompt').innerText = "🏆 恭喜你！成功解讀電量與充電提示，成為『電量小勇士』！";
            speak("恭喜你！成功解讀電量與充電提示，成為電量小勇士！");
            document.getElementById('avatarFace').innerText = "🥳🎉";
            document.getElementById('visualGraphicContainer').innerHTML = generateBatterySVG(100, false, false);
            
            triggerFireworks();
            setTimeout(triggerFireworks, 1000);

            const optionsArea = document.getElementById('answerOptionsArea');
            optionsArea.innerHTML = `
                <button onclick="loadLevel(1)" class="sen-btn bg-amber-500 hover:bg-amber-400 text-white border-amber-200 text-sen-large font-black w-full col-span-2 shadow-2xl">
                    🔄 再玩一次學習樂園
                </button>
            `;
        }

        // 煙火爆發效果 (Canvas particle physics)
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 6 + 4;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // 重力
                this.alpha -= this.decay;
            }
        }

        function triggerFireworks() {
            const colors = ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6'];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 3;

            for (let i = 0; i < 70; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(centerX + (Math.random() * 100 - 50), centerY + (Math.random() * 60 - 30), color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animateFireworks);
        }
        animateFireworks();

        // 頁面初次載入啟動
        window.onload = function() {
            loadLevel(1);
        };
    </script>
</body>
</html>
