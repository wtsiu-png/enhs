<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬「健康申報」練習</title>
    <style>
        /* 1. 護眼淡色背景與全局基礎設定 */
        body {
            background-color: #F0F7F4; /* 柔和護眼淺綠/灰白色 */
            color: #2C3E50;
            font-family: 'Microsoft JhengHei', "微軟正黑體", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
            user-select: none; /* 防止誤觸反白 */
        }

        /* 2. 主卡片容器 */
        .game-card {
            background-color: #FFFFFF;
            border: 6px solid #BEE3DB;
            border-radius: 30px;
            padding: 40px;
            max-width: 900px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
        }

        /* 3. 特大字體需求 (60px) */
        .big-title {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2B580C;
        }

        .question-text {
            font-size: 60px;
            font-weight: bold;
            margin: 20px 0;
            color: #1A365D;
            line-height: 1.3;
        }

        /* 4. 情境圖片/Emoji 展示區 (高對比度、大型視覺) */
        .card-visual {
            font-size: 150px;
            margin: 20px 0;
            background-color: #FAF9F6;
            border-radius: 20px;
            padding: 20px;
            display: inline-block;
            border: 4px dashed #89CFF0;
        }

        /* 5. 大按鈕與拉開距離 (防誤觸設計) */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 50px; /* 拉開 50px 距離，避免小手肌誤觸 */
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn-option {
            font-size: 60px;
            font-weight: bold;
            padding: 25px 50px;
            border-radius: 25px;
            border: 5px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            min-width: 280px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        /* 綠色/正確 按鈕款 */
        .btn-healthy {
            background-color: #C8E6C9;
            color: #1B5E20;
            border-color: #81C784;
        }

        /* 紅色/不舒服 按鈕款 */
        .btn-sick {
            background-color: #FFCDD2;
            color: #B71C1C;
            border-color: #E57373;
        }

        /* 按鈕點擊效果 */
        .btn-option:active {
            transform: scale(0.95);
        }

        /* 6. 溫柔提示訊息框 (答錯/提示) */
        .feedback-box {
            font-size: 60px;
            font-weight: bold;
            margin-top: 30px;
            padding: 20px;
            border-radius: 20px;
            display: none; /* 預設隱藏 */
        }

        .feedback-gentle {
            background-color: #FFF9C4; /* 溫和淺黃色 */
            color: #F57F17;
            border: 4px solid #FBC02D;
        }

        .feedback-correct {
            background-color: #E8F5E9;
            color: #2E7D32;
            border: 4px solid #66BB6A;
        }

        /* 7. 下一題按鈕 */
        .btn-next {
            font-size: 50px;
            font-weight: bold;
            background-color: #BBDEFB;
            color: #0D47A1;
            border: 4px solid #64B5F6;
            border-radius: 20px;
            padding: 15px 40px;
            margin-top: 30px;
            cursor: pointer;
            display: none;
        }

        /* 8. 全螢幕煙火 Canvas */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* 穿透不影響點擊 */
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- 全螢幕慶祝煙火動畫繪製區 -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- 遊戲卡片區域 -->
    <div class="game-card">
        <div class="big-title">📋 健康申報小衛士</div>
        
        <!-- 情境圖示 -->
        <div id="cardVisual" class="card-visual">🤒</div>
        
        <!-- 題目文字 (60px) -->
        <div id="questionText" class="question-text">摸起來熱熱的，量體溫發燒了，要怎麼申報？</div>

        <!-- 選項按鈕 (大間距防誤觸) -->
        <div class="button-group">
            <button class="btn-option btn-sick" onclick="checkAnswer(true)">
                🤒 我不舒服
            </button>
            <button class="btn-option btn-healthy" onclick="checkAnswer(false)">
                😊 我很健康
            </button>
        </div>

        <!-- 溫柔提示/回饋區域 -->
        <div id="feedbackBox" class="feedback-box"></div>

        <!-- 下一題按鈕 -->
        <button id="btnNext" class="btn-next" onclick="nextQuestion()">➡️ 下一題</button>
    </div>

    <script>
        /* ================= 1. 題目資料庫 (包含圖片Emoji與說明) ================= */
        const questions = [
            {
                visual: "🤒",
                text: "感覺頭昏昏的、量體溫發燒了，要怎麼申報？",
                isSick: true, // 應選擇「我不舒服」
                gentleHint: "身體發燒熱熱的，要誠實選『我不舒服』告訴老師喔！"
            },
            {
                visual: "😊",
                text: "精神很好、肚子不痛也沒發燒，要怎麼申報？",
                isSick: false, // 應選擇「我很健康」
                gentleHint: "身體很舒服、沒有生病，要選『我很健康』喔！"
            },
            {
                visual: "🤢",
                text: "肚子痛痛的、想吐吐，要怎麼申報？",
                isSick: true,
                gentleHint: "肚子痛痛的不舒服，要選『我不舒服』尋求幫忙喔！"
            },
            {
                visual: "😷",
                text: "一直咳嗽、流鼻水，要怎麼申報？",
                isSick: true,
                gentleHint: "生病咳嗽時，要誠實選『我不舒服』告訴大家喔！"
            }
        ];

        let currentQuestionIndex = 0;

        /* ================= 2. 音效系統 (使用 Web Audio API，無需外部音檔) ================= */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 叮咚聲 (答對慶祝)
        function playDingDong() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // 第一聲 "叮" (High G)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(783.99, audioCtx.currentTime);
            gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.5);

            // 第二聲 "咚" (High C)
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime);
                gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.8);
            }, 150);
        }

        // 溫柔提示音 (答錯不給予負面音效，給予柔和單音)
        function playGentleSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; // 柔和三角波
            osc.frequency.setValueAtTime(329.63, audioCtx.currentTime); // E4 柔和音
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        /* ================= 3. 答題判斷與溫柔回饋邏輯 ================= */
        function checkAnswer(userChoiceIsSick) {
            const q = questions[currentQuestionIndex];
            const feedbackBox = document.getElementById('feedbackBox');
            const btnNext = document.getElementById('btnNext');

            feedbackBox.style.display = 'block';

            if (userChoiceIsSick === q.isSick) {
                // 答對邏輯
                playDingDong();
                triggerFireworks(); // 施放彩帶煙火
                feedbackBox.className = 'feedback-box feedback-correct';
                feedbackBox.innerHTML = '🌟 太棒了！答對了！誠實申報最棒！';
                btnNext.style.display = 'inline-block';
            } else {
                // 答錯邏輯 (溫柔提示，無壓力)
                playGentleSound();
                feedbackBox.className = 'feedback-box feedback-gentle';
                feedbackBox.innerHTML = '💡 ' + q.gentleHint;
            }
        }

        // 切換下一題
        function nextQuestion() {
            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
            const q = questions[currentQuestionIndex];

            document.getElementById('cardVisual').innerText = q.visual;
            document.getElementById('questionText').innerText = q.text;
            document.getElementById('feedbackBox').style.display = 'none';
            document.getElementById('btnNext').style.display = 'none';
        }

        /* ================= 4. Canvas 彩帶煙火動畫特效 ================= */
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerFireworks() {
            particles = [];
            const colors = ['#FF5722', '#4CAF50', '#2196F3', '#FFEB3B', '#9C27B0', '#FF4081'];
            
            // 產生 80 個彩帶粒子
            for (let i = 0; i < 80; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 12 + 8,
                    alpha: 1
                });
            }
            animateFireworks();
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeParticles = false;

            particles.forEach(p => {
                if (p.alpha > 0) {
                    activeParticles = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2; // 重力效果
                    p.alpha -= 0.015; // 逐漸淡出

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });

            if (activeParticles) {
                requestAnimationFrame(animateFireworks);
            }
        }
    </script>
</body>
</html>
