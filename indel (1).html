<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尋找開與關 - 特教課室眼動互動遊戲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@600;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a; /* 背景深色，突出 16:9 畫布 */
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 16:9 強制自適應滿版容器 */
        .game-viewport {
            width: 100vw;
            height: 56.25vw; /* 16:9 比率 */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 比率 */
            background-color: #f0fdf4; /* 柔和護眼綠背景 */
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.2vh 1.5vw;
            position: relative;
            overflow: hidden;
        }

        /* 特大字體 */
        .text-giant {
            font-size: clamp(28px, 3.8vh, 58px);
            line-height: 1.15;
            font-weight: 900;
        }

        /* Tobii 眼動儀注視目標 */
        .gaze-target {
            position: relative;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), outline-color 0.15s ease;
            outline: 5px solid transparent;
            outline-offset: 2px;
            border-radius: 20px;
        }

        .gaze-target:hover, .gaze-target.gaze-hover {
            transform: scale(1.03);
            outline-color: #0284c7;
            z-index: 30;
        }

        /* Dwell Ring 環状進度條 */
        .dwell-ring-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(80px, 12vh);
            height: min(80px, 12vh);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .gaze-target:hover .dwell-ring-container,
        .gaze-target.gaze-hover .dwell-ring-container {
            opacity: 1;
        }

        .dwell-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .dwell-circle-bg {
            fill: rgba(255, 255, 255, 0.95);
            stroke: rgba(148, 163, 184, 0.5);
            stroke-width: 10;
        }

        .dwell-circle-progress {
            fill: none;
            stroke: #0284c7;
            stroke-width: 12;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.05s linear;
        }

        /* 物品標籤 */
        .item-label {
            background-color: rgba(255, 255, 255, 0.95);
            border: 2px solid #0284c7;
            color: #0f172a;
            font-weight: 900;
            font-size: clamp(12px, 1.8vh, 20px);
            padding: 0.3vh 1vw;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            white-space: nowrap;
        }

        .btn-large {
            padding: 0.6vh 1.2vw;
            border-radius: 14px;
            font-size: clamp(14px, 2vh, 22px);
            font-weight: 800;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- 音訊解鎖覆蓋層（Start Screen Overlay） -->
    <div id="start-overlay" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border-4 border-emerald-400 text-center max-w-xl w-full">
            <div class="text-6xl mb-4 animate-bounce">🎧</div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">尋找開與關</h2>
            <p class="text-lg font-bold text-emerald-700 mb-6">特教課室眼動與智能白板互動遊戲</p>
            <button id="start-btn" onclick="unlockAudioAndStart()" class="gaze-target w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-3xl py-6 px-8 rounded-2xl shadow-xl transition transform active:scale-95 border-4 border-emerald-300">
                ▶️ 點擊開始遊戲
            </button>
            <p class="text-xs text-slate-400 mt-4">點擊按鈕以啟用聲效與語音導覽</p>
        </div>
    </div>

    <!-- 16:9 橫向畫布 -->
    <div class="game-viewport">
        
        <!-- 頂部設定列 -->
        <header class="relative z-20 bg-white/90 backdrop-blur-md rounded-xl p-2 shadow border-2 border-emerald-200 flex items-center justify-between gap-2 h-[10%] min-h-[48px]">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">💡</span>
                <div>
                    <h1 class="text-sm md:text-base font-black text-emerald-900 leading-tight">特教課室 - 開關與聲音探索</h1>
                    <p class="text-[10px] md:text-xs font-bold text-emerald-600">支援 Tobii 眼動儀與全螢幕智能白板</p>
                </div>
            </div>

            <!-- 注視時間設定 -->
            <div class="flex items-center gap-1.5 bg-emerald-50 p-1 rounded-lg border border-emerald-200">
                <span class="text-xs font-black text-emerald-900 hidden sm:inline ml-1">⏱️ 注視：</span>
                <button id="dwell-08" onclick="setDwellSpeed(800, 'dwell-08')" class="gaze-target px-2 py-0.5 rounded text-xs font-bold bg-white text-emerald-800 border">0.8s 快速</button>
                <button id="dwell-12" onclick="setDwellSpeed(1200, 'dwell-12')" class="gaze-target px-2 py-0.5 rounded text-xs font-bold bg-emerald-600 text-white border border-emerald-600">1.2s 標準</button>
                <button id="dwell-20" onclick="setDwellSpeed(2000, 'dwell-20')" class="gaze-target px-2 py-0.5 rounded text-xs font-bold bg-white text-emerald-800 border">2.0s 慢速</button>
                <button id="dwell-off" onclick="setDwellSpeed(0, 'dwell-off')" class="gaze-target px-2 py-0.5 rounded text-xs font-bold bg-white text-gray-600 border">手動點擊</button>
            </div>

            <div class="flex items-center gap-2">
                <button id="sound-btn" onclick="toggleSound()" class="gaze-target bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                    <span id="sound-icon">🔊</span> 語音
                </button>
                <button onclick="resetClassroom()" class="gaze-target bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                    🔄 重置
                </button>
            </div>
        </header>

        <!-- 任務提示欄 (特大字體) -->
        <div id="prompt-bar" class="relative z-20 bg-white/95 rounded-xl px-4 py-1 text-center shadow border-2 border-sky-300 my-1.5 flex items-center justify-center h-[14%] min-h-[50px]">
            <div id="instruction-text" class="text-giant text-sky-950 font-black tracking-wide">
                👈 點擊或用眼睛注視課室內的物品！
            </div>
        </div>

        <!-- 7 個生活與教學開關物件 -->
        <main class="relative z-10 flex-grow w-full h-[64%] grid grid-cols-12 grid-rows-2 gap-2 p-0.5">
            
            <div id="obj-faucet" class="gaze-target col-span-4 row-span-1 bg-cyan-50/90 border-2 border-cyan-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-faucet"></div>
                <div class="item-label" id="label-faucet">水龍頭：關閉</div>
            </div>

            <div id="obj-light" class="gaze-target col-span-4 row-span-1 bg-yellow-50/90 border-2 border-yellow-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-light"></div>
                <div class="item-label" id="label-light">燈具：關閉</div>
            </div>

            <div id="obj-speaker" class="gaze-target col-span-4 row-span-1 bg-indigo-50/90 border-2 border-indigo-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-speaker"></div>
                <div class="item-label" id="label-speaker">藍牙喇叭：關閉</div>
            </div>

            <div id="obj-massage" class="gaze-target col-span-3 row-span-1 bg-emerald-50/90 border-2 border-emerald-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-massage"></div>
                <div class="item-label" id="label-massage">按摩槍：關閉</div>
            </div>

            <div id="obj-dryer" class="gaze-target col-span-3 row-span-1 bg-rose-50/90 border-2 border-rose-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-dryer"></div>
                <div class="item-label" id="label-dryer">風筒：關閉</div>
            </div>

            <div id="obj-book" class="gaze-target col-span-3 row-span-1 bg-amber-50/90 border-2 border-amber-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-book"></div>
                <div class="item-label" id="label-book">發聲圖書：合上</div>
            </div>

            <div id="obj-mic" class="gaze-target col-span-3 row-span-1 bg-purple-50/90 border-2 border-purple-200 rounded-2xl p-1.5 flex flex-col items-center justify-between relative shadow-sm">
                <div class="w-full h-[70%] flex items-center justify-center" id="svg-mic"></div>
                <div class="item-label" id="label-mic">藍牙咪高峰：關閉</div>
            </div>

        </main>

        <!-- 底部工具列 -->
        <footer class="relative z-20 bg-white/90 rounded-xl p-1.5 border border-emerald-200 flex items-center justify-between gap-2 h-[10%] min-h-[44px]">
            <div class="flex items-center gap-2">
                <button onclick="setGameMode('explore')" id="mode-explore" class="gaze-target btn-large bg-sky-500 text-white border-sky-600 shadow ring-2 ring-sky-200">
                    🔍 自由探索模式
                </button>
                <button onclick="setGameMode('task')" id="mode-task" class="gaze-target btn-large bg-emerald-600 text-white border-emerald-700 shadow">
                    🎯 任務挑戰模式
                </button>
            </div>

            <div id="score-stars" class="flex items-center gap-1.5 font-black text-amber-500 bg-amber-50 px-3 py-0.5 rounded-lg border border-amber-200 text-base md:text-lg">
                <span>⭐ 答對：</span>
                <span id="star-count" class="text-xl font-black">0</span>
            </div>
        </footer>

    </div>

    <!-- 邏輯與強健 Web Audio API 音效引擎 -->
    <script>
        const classroomItems = {
            faucet: {
                id: 'faucet',
                name: '水龍頭',
                isOpen: false,
                openLabel: '水龍頭：開啟 (流水中)',
                closedLabel: '水龍頭：關閉',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M20 70 L20 40 Q20 15 45 15 L65 15 Q75 15 75 25 L75 35" fill="none" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/><rect x="35" y="10" width="20" height="10" rx="3" fill="#64748B"/><path d="M75 35 L75 85" fill="none" stroke="#38BDF8" stroke-width="8" stroke-dasharray="6,4" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;20" dur="0.4s" repeatCount="indefinite"/></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M20 70 L20 40 Q20 15 45 15 L65 15 Q75 15 75 25 L75 35" fill="none" stroke="#64748B" stroke-width="12" stroke-linecap="round"/><rect x="35" y="5" width="20" height="10" rx="3" fill="#475569"/></svg>`
            },
            light: {
                id: 'light',
                name: '燈具',
                isOpen: false,
                openLabel: '燈具：開啟 (亮燈)',
                closedLabel: '燈具：關閉',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="28" fill="#FEF08A" stroke="#EAB308" stroke-width="4"/><path d="M50 5 L50 18 M50 82 L50 95 M5 50 L18 50 M82 50 L95 50 M18 18 L28 28 M72 72 L82 82 M18 82 L28 72 M72 28 L82 18" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="50" r="28" fill="#CBD5E1" stroke="#64748B" stroke-width="4"/><path d="M40 78 L60 78" stroke="#64748B" stroke-width="4" stroke-linecap="round"/></svg>`
            },
            speaker: {
                id: 'speaker',
                name: '藍牙喇叭',
                isOpen: false,
                openLabel: '藍牙喇叭：開啟 (播放中)',
                closedLabel: '藍牙喇叭：關閉',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><rect x="25" y="20" width="50" height="60" rx="12" fill="#6366F1" stroke="#4338CA" stroke-width="4"/><circle cx="50" cy="40" r="10" fill="#E0E7FF"/><circle cx="50" cy="62" r="12" fill="#E0E7FF"/><path d="M10 40 Q5 50 10 60 M90 40 Q95 50 90 60" fill="none" stroke="#818CF8" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.8s" repeatCount="indefinite"/></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><rect x="25" y="20" width="50" height="60" rx="12" fill="#64748B" stroke="#334155" stroke-width="4"/><circle cx="50" cy="40" r="10" fill="#94A3B8"/><circle cx="50" cy="62" r="12" fill="#94A3B8"/></svg>`
            },
            massage: {
                id: 'massage',
                name: '按摩槍',
                isOpen: false,
                openLabel: '按摩槍：開啟 (震動中)',
                closedLabel: '按摩槍：關閉',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><g><path d="M20 30 L65 30 L65 48 L20 48 Z" fill="#10B981" stroke="#047857" stroke-width="3"/><rect x="30" y="48" width="16" height="38" rx="4" fill="#059669"/><circle cx="80" cy="39" r="12" fill="#34D399"/><path d="M92 30 L96 39 L92 48" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"><animate attributeName="transform" type="translate" values="-2,0; 2,0; -2,0" dur="0.1s" repeatCount="indefinite"/></path></g></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M20 30 L65 30 L65 48 L20 48 Z" fill="#64748B" stroke="#334155" stroke-width="3"/><rect x="30" y="48" width="16" height="38" rx="4" fill="#475569"/><circle cx="80" cy="39" r="12" fill="#94A3B8"/></svg>`
            },
            dryer: {
                id: 'dryer',
                name: '風筒',
                isOpen: false,
                openLabel: '風筒：開啟 (出風中)',
                closedLabel: '風筒：關閉',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M15 25 L60 25 L60 48 L15 48 Z" fill="#F43F5E" stroke="#BE123C" stroke-width="3"/><rect x="25" y="48" width="14" height="36" rx="3" fill="#E11D48"/><path d="M65 30 L85 22 M65 36 L90 36 M65 43 L85 50" stroke="#FB7185" stroke-width="4" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="10;0" dur="0.2s" repeatCount="indefinite"/></path></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M15 25 L60 25 L60 48 L15 48 Z" fill="#64748B" stroke="#334155" stroke-width="3"/><rect x="25" y="48" width="14" height="36" rx="3" fill="#475569"/></svg>`
            },
            book: {
                id: 'book',
                name: '發聲圖書',
                isOpen: false,
                openLabel: '發聲圖書：開啟 (發聲中)',
                closedLabel: '發聲圖書：合上',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><path d="M10 30 Q 50 15, 50 30 Q 50 15, 90 30 L 90 75 Q 50 60, 50 75 Q 50 60, 10 75 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3"/><circle cx="30" cy="50" r="6" fill="#F59E0B"/><path d="M68 45 L72 55 L78 55 L73 59 L75 66 L70 61 L65 66 L67 59 L62 55 L68 55 Z" fill="#F59E0B"/></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><rect x="28" y="20" width="48" height="60" rx="5" fill="#D97706" stroke="#92400E" stroke-width="4"/><rect x="22" y="20" width="8" height="60" rx="2" fill="#FCD34D"/></svg>`
            },
            mic: {
                id: 'mic',
                name: '藍牙咪高峰',
                isOpen: false,
                openLabel: '藍牙咪高峰：開啟 (擴音中)',
                closedLabel: '藍牙咪高峰：關閉',
                openSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="30" r="18" fill="#A855F7" stroke="#7E22CE" stroke-width="3"/><rect x="44" y="48" width="12" height="38" rx="4" fill="#9333EA"/><path d="M22 25 Q15 30 22 35 M78 25 Q85 30 78 35" fill="none" stroke="#C084FC" stroke-width="4" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite"/></path></svg>`,
                closedSvg: `<svg viewBox="0 0 100 100" class="w-full h-full"><circle cx="50" cy="30" r="18" fill="#64748B" stroke="#334155" stroke-width="3"/><rect x="44" y="48" width="12" height="38" rx="4" fill="#475569"/></svg>`
            }
        };

        let gameMode = 'explore';
        let targetTask = null;
        let scoreStars = 0;
        let isSoundEnabled = true;
        let dwellTimeMs = 1200;

        let activeDwellTarget = null;
        let dwellStartTime = 0;
        let animFrameId = null;

        // Web Audio Context
        let audioCtx = null;

        function unlockAudioAndStart() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            document.getElementById('start-overlay').style.display = 'none';
            speakText("歡迎來到開關與聲音探索課室！請點擊或用眼睛注視物件！");
            playItemSound('light', true);
        }

        function ensureAudioActive() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Web Audio 合成音效
        function playItemSound(itemKey, isOpen) {
            if (!isSoundEnabled) return;
            ensureAudioActive();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (!isOpen) {
                // 關閉音效 (Click Down)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
                return;
            }

            // 開啟音效（各物品獨有）
            switch (itemKey) {
                case 'faucet': { // 水聲
                    const bufferSize = audioCtx.sampleRate * 0.7;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.Q.setValueAtTime(2.5, now);

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start(now);
                    break;
                }
                case 'light': { // 亮燈喀噠與開關響聲
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(700, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                    break;
                }
                case 'speaker': { // 藍牙喇叭發聲音樂
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + i * 0.09);
                        gain.gain.setValueAtTime(0.2, now + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.09 + 0.18);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + i * 0.09);
                        osc.stop(now + i * 0.09 + 0.18);
                    });
                    break;
                }
                case 'massage': { // 按摩槍震動聲
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(65, now);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.55);
                    break;
                }
                case 'dryer': { // 風筒風聲
                    const bufferSize = audioCtx.sampleRate * 0.6;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, now);
                    filter.frequency.linearRampToValueAtTime(1600, now + 0.25);

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.45, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    noise.start(now);
                    break;
                }
                case 'book': { // 發聲圖書木琴音樂
                    const tune = [659.25, 783.99, 880, 1046.50];
                    tune.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.11);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.11);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.11 + 0.22);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.11);
                        osc.stop(now + idx * 0.11 + 0.22);
                    });
                    break;
                }
                case 'mic': { // 咪高峰擴音迴聲
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                    break;
                }
            }
        }

        // 語音朗讀
        function speakText(text) {
            if (!isSoundEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // Dwell Selection 視線停留
        function setDwellSpeed(ms, buttonId) {
            dwellTimeMs = ms;
            playItemSound('light', true);

            ['dwell-08', 'dwell-12', 'dwell-20', 'dwell-off'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === buttonId) {
                    btn.className = "gaze-target px-2 py-0.5 rounded text-xs font-bold bg-emerald-600 text-white border border-emerald-600 shadow";
                } else {
                    btn.className = "gaze-target px-2 py-0.5 rounded text-xs font-bold bg-white text-emerald-800 border";
                }
            });
        }

        function createDwellRingHTML() {
            return `
                <div class="dwell-ring-container">
                    <svg class="dwell-svg" viewBox="0 0 100 100">
                        <circle class="dwell-circle-bg" cx="50" cy="50" r="45" />
                        <circle class="dwell-circle-progress" cx="50" cy="50" r="45" />
                    </svg>
                </div>
            `;
        }

        function attachGazeListeners(element, triggerCallback) {
            let ringProgress = null;

            function startDwell(e) {
                if (dwellTimeMs <= 0) return;
                if (activeDwellTarget === element) return;

                activeDwellTarget = element;
                dwellStartTime = performance.now();
                ringProgress = element.querySelector('.dwell-circle-progress');

                function updateProgress(now) {
                    if (activeDwellTarget !== element) return;

                    const elapsed = now - dwellStartTime;
                    const progress = Math.min(elapsed / dwellTimeMs, 1.0);

                    if (ringProgress) {
                        ringProgress.style.strokeDashoffset = 283 - (283 * progress);
                    }

                    if (progress < 1.0) {
                        animFrameId = requestAnimationFrame(updateProgress);
                    } else {
                        triggerCallback(e);
                        cancelDwell();
                    }
                }

                animFrameId = requestAnimationFrame(updateProgress);
            }

            function cancelDwell() {
                if (activeDwellTarget === element) {
                    activeDwellTarget = null;
                    if (animFrameId) cancelAnimationFrame(animFrameId);
                    if (ringProgress) ringProgress.style.strokeDashoffset = 283;
                }
            }

            element.addEventListener('pointerenter', startDwell);
            element.addEventListener('pointerleave', cancelDwell);
            element.addEventListener('touchstart', startDwell, { passive: true });
            element.addEventListener('touchend', cancelDwell);

            element.addEventListener('click', (e) => {
                cancelDwell();
                triggerCallback(e);
            });
        }

        // 渲染物件與狀態
        function renderClassroomItem(key) {
            const item = classroomItems[key];
            const svgContainer = document.getElementById(`svg-${key}`);
            const labelContainer = document.getElementById(`label-${key}`);

            if (item.isOpen) {
                svgContainer.innerHTML = item.openSvg;
                labelContainer.innerText = item.openLabel;
                labelContainer.className = "item-label bg-amber-100 text-amber-900 border-amber-400";
            } else {
                svgContainer.innerHTML = item.closedSvg;
                labelContainer.innerText = item.closedLabel;
                labelContainer.className = "item-label bg-slate-100 text-slate-800 border-slate-300";
            }
        }

        function toggleItemState(key) {
            const item = classroomItems[key];
            item.isOpen = !item.isOpen;
            renderClassroomItem(key);

            playItemSound(key, item.isOpen);

            if (gameMode === 'explore') {
                const stateText = item.isOpen ? '開啟了' : '關閉了';
                document.getElementById('instruction-text').innerHTML = `你把 <span class="text-emerald-600 font-extrabold">${item.name}</span> ${stateText}！`;
                speakText(`${item.name}${stateText}！`);
            } else if (gameMode === 'task') {
                checkTaskCompletion(key);
            }
        }

        // 任務挑戰
        function checkTaskCompletion(clickedKey) {
            if (!targetTask) return;

            const clickedItem = classroomItems[clickedKey];
            const requiredIsOpen = targetTask.requiredState === 'open';

            if (clickedKey === targetTask.itemId && clickedItem.isOpen === requiredIsOpen) {
                scoreStars++;
                document.getElementById('star-count').innerText = scoreStars;

                const stateCN = requiredIsOpen ? '開啟' : '關閉';
                document.getElementById('instruction-text').innerHTML = `🎉 太棒了！成功${stateCN}了 <span class="text-emerald-600 font-extrabold">${clickedItem.name}</span>！`;
                speakText(`太棒了！答對了！你成功${stateCN}了${clickedItem.name}！`);

                setTimeout(() => {
                    generateNextTask();
                }, 2200);
            } else {
                speakText(`${clickedItem.name}${clickedItem.isOpen ? '開啟了' : '關閉了'}，再找找看目標物件喔！`);
            }
        }

        function generateNextTask() {
            const keys = Object.keys(classroomItems);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const randomState = Math.random() > 0.5 ? 'open' : 'closed';

            targetTask = { itemId: randomKey, requiredState: randomState };
            const item = classroomItems[randomKey];
            const actionCN = randomState === 'open' ? '開啟' : '關閉';

            document.getElementById('instruction-text').innerHTML = `請找出或點擊，把「<span class="text-rose-600 font-extrabold">${item.name}</span>」變成【<span class="text-sky-600 font-extrabold">${actionCN}</span>】！`;
            speakText(`請找出並把${item.name}變成${actionCN}的狀態！`);
        }

        function setGameMode(mode) {
            gameMode = mode;
            playItemSound('light', true);

            const btnExplore = document.getElementById('mode-explore');
            const btnTask = document.getElementById('mode-task');

            if (mode === 'explore') {
                btnExplore.className = "gaze-target btn-large bg-sky-500 text-white border-sky-600 shadow ring-2 ring-sky-200";
                btnTask.className = "gaze-target btn-large bg-gray-200 text-gray-700 border-gray-300 opacity-80";
                document.getElementById('instruction-text').innerHTML = "👈 自由探索模式：點擊或注視物件以開啟/關閉！";
                speakText("進入自由探索模式，請點擊或用眼睛注視課室內的物品！");
            } else {
                btnTask.className = "gaze-target btn-large bg-emerald-600 text-white border-emerald-700 shadow ring-2 ring-emerald-200";
                btnExplore.className = "gaze-target btn-large bg-gray-200 text-gray-700 border-gray-300 opacity-80";
                generateNextTask();
            }
        }

        function resetClassroom() {
            playItemSound('faucet', false);
            Object.keys(classroomItems).forEach(key => {
                classroomItems[key].isOpen = false;
                renderClassroomItem(key);
            });
            scoreStars = 0;
            document.getElementById('star-count').innerText = "0";

            if (gameMode === 'task') {
                generateNextTask();
            } else {
                document.getElementById('instruction-text').innerHTML = "🔄 已重置所有物品狀態！";
                speakText("已重置所有物品！");
            }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            document.getElementById('sound-icon').innerText = isSoundEnabled ? '🔊' : '🔇';
        }

        // 初始化
        window.onload = () => {
            Object.keys(classroomItems).forEach(key => {
                const cardEl = document.getElementById(`obj-${key}`);
                cardEl.insertAdjacentHTML('afterbegin', createDwellRingHTML());
                attachGazeListeners(cardEl, () => toggleItemState(key));
                renderClassroomItem(key);
            });

            document.querySelectorAll('header .gaze-target, footer .gaze-target').forEach(btn => {
                btn.insertAdjacentHTML('afterbegin', createDwellRingHTML());
            });
        };
    </script>
</body>
</html>
